name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job needs to write anything (no releases, no PR comments, no checks
# API calls) — read-only is the least privilege the checkout + test/typecheck
# steps require. Addresses CodeQL actions/missing-workflow-permissions (#1, #2).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --extra mcp so the `--serve` MCP-server tests run (they importorskip
      # without it); the missing-extra CLI path is covered by a sys.modules stub.
      - name: Install dependencies
        run: uv sync --group dev --extra mcp

      - name: Run tests with coverage
        run: uv run pytest --cov=graphlm --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.13'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Default `test` job above runs without `[js]`, so the grammar-absent
  # degradation path is what CI exercises on every PR. This job installs the
  # extra and runs the enabled-path JS/TS tests (they skip without it).
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (js extra)
        run: uv sync --group dev --extra mcp --extra js

      - name: Run tests
        run: uv run pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run mypy
        run: uv run mypy graphlm --ignore-missing-imports
