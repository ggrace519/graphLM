[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphlm"
version = "0.1.0"
description = "Generate codebase graphs (Markdown + JSON) from any project directory using an OpenAI-compatible LLM"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "typer",
    "httpx",
    "pydantic>=2.0",
]

[project.scripts]
graphlm = "graphlm.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.hatch.build.targets.wheel]
packages = ["graphlm"]
