[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphlm"
version = "0.2.0"
description = "Generate codebase graphs (Markdown + JSON + interactive HTML) from any project directory using an OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Greg Grace", email = "graphlm@519lab.com" }]
keywords = ["codebase", "graph", "llm", "static-analysis", "tree-sitter", "documentation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "python-dotenv",
    "typer",
    "httpx",
    "pydantic>=2.0",
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-python>=0.25.0,<0.26",
]

[project.optional-dependencies]
# `graphlm --serve` — the MCP server that lets a coding agent query the map.
# Opt-in so the base install stays lean; the CLI prints an install hint if the
# flag is used without it.
mcp = ["mcp>=2,<3"]

[project.urls]
Homepage = "https://github.com/ggrace519/graphLM"
Repository = "https://github.com/ggrace519/graphLM"
Changelog = "https://github.com/ggrace519/graphLM/blob/main/CHANGELOG.md"
Issues = "https://github.com/ggrace519/graphLM/issues"

[project.scripts]
graphlm = "graphlm.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-httpx",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.hatch.build.targets.wheel]
packages = ["graphlm"]

# Release automation: `uvx bump-my-version bump patch|minor|major`
# Bumps project.version (auto — config lives here), promotes the CHANGELOG's
# [Unreleased] section to a dated release header, updates the compare links,
# then makes a signed commit + signed tag `vX.Y.Z`. Run `uv lock` afterward
# (bump-my-version does not) and `git push --follow-tags` to publish.
# NOTE: keep current_version in step with project.version above.
[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
sign_tags = true
tag_name = "v{new_version}"
tag_message = "graphlm v{new_version}"
commit_args = "--gpg-sign"
message = "chore(release): {new_version}"
allow_dirty = false

# CHANGELOG: insert a dated release header below the permanent [Unreleased]
# heading (we keep [Unreleased], we don't rename it).
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] - {utcnow:%Y-%m-%d}"""

# CHANGELOG: rewrite the Unreleased compare link to the new version AND add the
# new version's own compare link, in one replacement (order-independent).
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/ggrace519/graphLM/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/ggrace519/graphLM/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/ggrace519/graphLM/compare/v{current_version}...v{new_version}"""
