# Large test project — FastAPI-style web app

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "largetest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "jinja2", "uvicorn"]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
